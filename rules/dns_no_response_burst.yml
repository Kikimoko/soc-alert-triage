title: DNS queries with no responses in high volume
id: dns_no_response_burst
status: experimental
description: Flow-level detection over UNSW-NB15-style records (thresholds reviewed on the TRAINING partition only).
logsource:
    category: network_flow
detection:
    selection:
        proto: udp
        service: dns
        dpkts: 0
        ct_srv_src|gte: 10
    condition: selection
level: medium
tags:
    - attack.command_and_control
    - attack.t1071.004
